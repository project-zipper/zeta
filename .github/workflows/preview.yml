name: Zeta Build System

on:
  push:
    branches: ["16-dev"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show project structure (DEBUG)
        run: |
          echo "==== ROOT FILES ===="
          ls -la

          echo "==== SEARCH FOR GRADLE FILES ===="
          find . -name "build.gradle" || true
          find . -name "settings.gradle" || true
          find . -name "gradlew" || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fix Gradle permissions
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-34" || true
          sdkmanager "build-tools;34.0.0" || true

      - name: Detect build system
        id: detect
        run: |
          if [ -f "./gradlew" ]; then
            echo "build_cmd=./gradlew" >> $GITHUB_OUTPUT
          else
            echo "build_cmd=echo 'NO GRADLE FOUND - NOT AN ANDROID PROJECT'" >> $GITHUB_OUTPUT
          fi

      - name: Try build (safe mode)
        run: |
          echo "Using build command:"
          echo "${{ steps.detect.outputs.build_cmd }}"

          if [ -f "./gradlew" ]; then
            ./gradlew tasks || true
            ./gradlew assembleDebug || ./gradlew build || true
          else
            echo "❌ This repo is not a full Android Gradle project yet."
            exit 1
          fi

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/
