name: Zeta 170 Preview Generator

on:
  push:
    branches: [ "16-dev" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator system image
        run: |
          sdkmanager "system-images;android-34;google_apis;x86_64"
          sdkmanager "platform-tools" "emulator"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd -n zeta_preview -k "system-images;android-34;google_apis;x86_64"

      - name: Start Emulator
        run: |
          nohup emulator -avd zeta_preview -no-window -no-audio -gpu swiftshader_indirect &
          adb wait-for-device

      - name: Install app
        run: |
          adb install app/build/outputs/apk/debug/app-debug.apk || true

  capture_batch_1:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        range: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tools
        run: sudo apt-get update && sudo apt-get install ffmpeg -y

      - name: Capture 170 frames (split batches)
        run: |
          mkdir -p preview/png
          mkdir -p preview/gif

          START=$(( (matrix.range - 1) * 34 + 1 ))
          END=$(( matrix.range * 34 ))

          for i in $(seq $START $END)
          do
            echo "Rendering frame $i"

            # simulate launcher actions (replace later with real intents)
            adb shell input keyevent 82

            # screenshot PNG
            adb exec-out screencap -p > preview/png/frame_$(printf "%03d" $i).png

            # short recording GIF source
            adb shell screenrecord --time-limit 2 /sdcard/frame_$i.mp4
            adb pull /sdcard/frame_$i.mp4 preview/gif/frame_$i.mp4
          done

      - name: Convert MP4 → GIF
        run: |
          for i in $(seq $START $END)
          do
            ffmpeg -y -i preview/gif/frame_$i.mp4 preview/gif/anim_$(printf "%03d" $i).gif
          done

      - name: Upload batch
        uses: actions/upload-artifact@v4
        with:
          name: zeta-preview-batch-${{ matrix.range }}
          path: preview
